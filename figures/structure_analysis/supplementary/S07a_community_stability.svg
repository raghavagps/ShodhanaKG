<title>S07a_community_stability</title><desc>20 seeds per network per projection. Selected partition maximizes mean agreement; ties use lowest seed. Comparison with multiplicity-weighted projection is exploratory sensitivity, not evidence that communities are clinically valid. ARI is adjusted Rand index.</desc></svg>