<title>S09_supported_paths</title><desc>Exact path UNDERGOES → PRODUCES → USED_FOR_TREATMENT with Compound → Shodhana Method → Purified Compound → Disease node types. Structural paths may join different sources. A nonempty exact-reference intersection is reported separately; it still does not prove a single experimental context or clinical efficacy. No unsupported alternate path is inferred.</desc></svg>