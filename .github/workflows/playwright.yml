name: Project verification
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webservice/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webservice/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  live-kg-release:
    # Explicit opt-in: a protected runner with the independently audited KG and running services.
    # Never execute untrusted PR code on a runner with database access.
    if: github.event_name == 'workflow_dispatch'
    needs: frontend
    runs-on: [self-hosted, shodhanakg]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: webservice/frontend
      - run: python -B webservice/api/tests/run_release_checks.py --output-dir release-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-release-checks
          path: release-artifacts/
