<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShodhanaKG — Knowledge Graph Animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./fonts/fonts.css">
<style>

  :root{
    --parchment: #F4EEE2;
    --parchment-deep: #ECE3D2;
    --ink: #3A2F28;
    --terracotta: #C1602D;
    --terracotta-deep: #9C4520;
    --terracotta-soft: #D98A5E;
    --maroon: #6E2A1E;
    --sage: #7C8F5D;
    --sage-deep: #5C6E42;
    --sage-soft: #A3B283;
    --ochre: #D4A72C;
    --gold: #E8C15A;
    --clay: #A9784F;
    --line: #B98A5A;
    --line-strong: #8A5A2E;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:
      radial-gradient(ellipse 90% 70% at 50% 42%, #FDFAF2 0%, var(--parchment) 45%, var(--parchment-deep) 78%, #E4D7BE 100%);
    font-family: 'Manrope', 'Segoe UI', sans-serif;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage::before{
    /* subtle paper grain / vignette so the earthy palette doesn't feel flat */
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse 60% 60% at 50% 50%, transparent 35%, rgba(58,47,40,0.07) 100%);
    pointer-events:none;
  }

  svg.graph{
    width:min(96vw, 1200px);
    height:auto;
    overflow:visible;
  }

  /* ============ YANTRA BACKGROUND (signature element) ============ */
  .yantra{
    fill:none;
    stroke: var(--clay);
    opacity:0.16;
  }
  .yantra-circ-tight{ stroke-width:1.3; opacity:0.3; }
  .yantra-circ-dash{ stroke-dasharray: 1 6; stroke-width:1.6; opacity:0.3; }
  .yantra-circ-dot{ stroke-dasharray: 0.5 5; stroke-width:1.8; opacity:0.24; }

  /* whole mandala breathes gently, forever */
  .yantra-layer{
    animation: yantraPulse 9s ease-in-out infinite;
    transform-origin: 600px 400px;
  }
  @keyframes yantraPulse{
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.018); }
  }

  /* independent slow counter-rotation, once revealed */
  .yantra-ring1-wrap{ animation: rotateSlowRev 150s linear infinite; transform-origin: 600px 400px; }
  .yantra-outer-wrap{ animation: rotateSlow 220s linear infinite; transform-origin: 600px 400px; }
  @keyframes rotateSlow{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  @keyframes rotateSlowRev{ from{ transform:rotate(0deg);} to{ transform:rotate(-360deg);} }

  /* ---- staged reveal, loops every 16s: dot -> rings -> lotus blooms (tier by tier) -> hexagram forms -> hold/pulse ---- */
  .yantra-dot{
    fill: var(--gold);
    opacity:0;
    transform-origin: 600px 400px;
    animation: dotReveal 16s ease-in-out infinite;
  }
  .yantra-ring1-reveal{
    opacity:0;
    transform-origin: 600px 400px;
    animation: ring1Reveal 16s ease-in-out infinite;
  }
  .yantra-outer-reveal{
    opacity:0;
    transform-origin: 600px 400px;
    animation: outerReveal 16s ease-in-out infinite;
  }

  .yantra-lotus-inner,
  .yantra-lotus-middle,
  .yantra-lotus-outer{
    opacity:0;
    transform-origin: 0px 0px;
  }
  .yantra-lotus-inner { animation: bloomInner 16s ease-in-out infinite; }
  .yantra-lotus-middle{ animation: bloomMiddle 16s ease-in-out infinite; }
  .yantra-lotus-outer { animation: bloomOuter 16s ease-in-out infinite; }

  @keyframes dotReveal{
    0%        { opacity:0; transform:scale(0); }
    5%        { opacity:1; transform:scale(1); }
    90%       { opacity:1; transform:scale(1); }
    96%,100%  { opacity:0; transform:scale(0); }
  }
  @keyframes ring1Reveal{
    0%,6%     { opacity:0; transform:scale(0); }
    16%       { opacity:1; transform:scale(1); }
    88%       { opacity:1; transform:scale(1); }
    95%,100%  { opacity:0; transform:scale(0); }
  }
  /* lotus blooms outward tier by tier, like unfurling in real time */
  @keyframes bloomInner{
    0%,18%    { opacity:0; transform:scale(0.15) rotate(-18deg); }
    30%       { opacity:1; transform:scale(1) rotate(0deg); }
    85%       { opacity:1; transform:scale(1) rotate(0deg); }
    93%       { opacity:0; transform:scale(0.4) rotate(8deg); }
    100%      { opacity:0; transform:scale(0.15) rotate(-18deg); }
  }
  @keyframes bloomMiddle{
    0%,26%    { opacity:0; transform:scale(0.15) rotate(-18deg); }
    40%       { opacity:1; transform:scale(1) rotate(0deg); }
    85%       { opacity:1; transform:scale(1) rotate(0deg); }
    92%       { opacity:0; transform:scale(0.4) rotate(8deg); }
    100%      { opacity:0; transform:scale(0.15) rotate(-18deg); }
  }
  @keyframes bloomOuter{
    0%,34%    { opacity:0; transform:scale(0.15) rotate(-18deg); }
    50%       { opacity:1; transform:scale(1) rotate(0deg); }
    85%       { opacity:1; transform:scale(1) rotate(0deg); }
    91%       { opacity:0; transform:scale(0.4) rotate(8deg); }
    100%      { opacity:0; transform:scale(0.15) rotate(-18deg); }
  }
  @keyframes outerReveal{
    0%,3%     { opacity:0; transform:scale(0.72) rotate(-4deg); }
    9%        { opacity:1; transform:scale(1) rotate(0deg); }
    88%       { opacity:1; transform:scale(1) rotate(0deg); }
    94%       { opacity:0; transform:scale(0.85); }
    100%      { opacity:0; transform:scale(0.72) rotate(-4deg); }
  }

  /* ============ EDGES ============ */

  .edge-path{
    fill:none;
    stroke:var(--line-strong);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:1;
    stroke-dashoffset:1;
    opacity:0.85;
  }
  .edge-path-sat{ stroke-width:2.4; opacity:0.75; }
  .edge-left{ stroke: url(#gradEdgeL); }
  .edge-right{ stroke: url(#gradEdgeR); }

  .edge-particle{
    fill:var(--ochre);
    filter:drop-shadow(0 0 5px rgba(212,167,44,0.95));
    opacity:0;
  }
  .edge-particle-sat{ fill:var(--terracotta-soft); r:3.2; }

  .edge-branch .edge-path{ animation: drawBranchEdge 16s ease-in-out infinite; }
  .edge-sat .edge-path{ animation: drawSatEdge 16s ease-in-out infinite; }
  .edge-anchor .edge-particle{ animation: particleFade 16s ease-in-out infinite; }

  @keyframes drawBranchEdge{
    0%,5.6%   { stroke-dashoffset:1; opacity:0; }
    11%       { stroke-dashoffset:0; opacity:0.85; }
    76%       { stroke-dashoffset:0; opacity:0.85; }
    81%       { stroke-dashoffset:1; opacity:0; }
    100%      { stroke-dashoffset:1; opacity:0; }
  }

  @keyframes drawSatEdge{
    0%,11.25% { stroke-dashoffset:1; opacity:0; }
    17%       { stroke-dashoffset:0; opacity:0.75; }
    64%       { stroke-dashoffset:0; opacity:0.75; }
    69%       { stroke-dashoffset:1; opacity:0; }
    100%      { stroke-dashoffset:1; opacity:0; }
  }

  @keyframes particleFade{
    0%,15%    { opacity:0; }
    20%,60%   { opacity:0.85; }
    68%,100%  { opacity:0; }
  }

  /* ============ NODES ============ */

  .node-circle{ stroke:none; }
  .node-ring{ fill:none; stroke-width:1.4; opacity:0.9; }
  .node-glow{ opacity:0.35; }

  .core-circle{ fill: url(#gradCore); filter: drop-shadow(0 4px 22px rgba(193,96,45,0.6)); }
  .core-ring{ stroke: var(--gold); stroke-width:2.2; }
  .core-ring-inner{ fill:none; stroke: rgba(255,244,224,0.55); stroke-width:1; }
  .node-anchor.core .node-glow{ fill: var(--ochre); }

  .branch-l-circle{ stroke:none; fill:url(#gradBranchL); }
  .branch-r-circle{ stroke:none; fill:url(#gradBranchR); }
  .branch-l-ring{ stroke: var(--sage-deep); stroke-width:2.4; }
  .branch-r-ring{ stroke: var(--terracotta-deep); stroke-width:2.4; }
  .node-anchor.branch-l .node-glow{ fill: var(--sage-soft); }
  .node-anchor.branch-r .node-glow{ fill: var(--terracotta-soft); }
  .branch-circle{ filter: drop-shadow(0 5px 14px rgba(58,47,40,0.24)); }

  .sat-l .node-circle{ fill:url(#gradSatL); }
  .sat-r .node-circle{ fill:url(#gradSatR); }
  .sat-l .node-ring{ stroke: var(--sage); stroke-width:1.8; }
  .sat-r .node-ring{ stroke: var(--terracotta); stroke-width:1.8; }
  .sat .node-glow{ opacity:0.25; }
  .sat-l .node-glow{ fill: var(--sage-soft); }
  .sat-r .node-glow{ fill: var(--terracotta-soft); }
  .sat .node-circle{ filter: drop-shadow(0 3px 8px rgba(58,47,40,0.18)); }

  .label-core{
    font-family: 'Fraunces', Georgia, serif;
    font-size: 27px;
    font-weight: 700;
    fill: var(--ink);
    letter-spacing: 0.5px;
  }
  .label-branch{
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    fill: var(--ink);
  }
  .label-sat{
    font-family: 'Fraunces', Georgia, serif;
    font-size: 19px;
    font-weight: 700;
    fill: var(--clay);
    letter-spacing: 0.2px;
  }

  /* ============ DOODLE ICONS ============ */

  .node-icon{
    fill:none;
    stroke-width:2.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    pointer-events:none;
  }

  .icon-sage{ color: var(--sage); stroke: var(--sage); }
  .icon-terracotta{ color: var(--terracotta); stroke: var(--terracotta); }
  .icon-cream{ color: #FBF3E4; stroke: #FBF3E4; stroke-width:3; }

  .node-anchor.core .node-icon{ opacity:1; }
  .node-anchor.branch .node-icon{ stroke-width:3; opacity:1; }
  .node-anchor.sat .node-icon{ stroke-width:2.4; opacity:1; }

  /* entrance / hold / exit choreography — same 16s cycle for every node,
     timing baked into each keyframe's own percentages */
  .node-anchor.core        { animation: coreLife 16s ease-in-out infinite; transform-origin: 600px 400px; }
  .node-anchor.branch      { animation: branchLife 16s ease-in-out infinite; }
  .node-anchor.branch-l    { transform-origin: 300px 400px; }
  .node-anchor.branch-r    { transform-origin: 900px 400px; }
  .node-anchor.sat         { animation: satLife 16s ease-in-out infinite; }

  @keyframes coreLife{
    0%    { opacity:0; transform: scale(0.4); }
    4%    { opacity:1; transform: scale(1.12); }
    7%    { opacity:1; transform: scale(1); }
    88%   { opacity:1; transform: scale(1); }
    94%   { opacity:0; transform: scale(0.5); }
    100%  { opacity:0; transform: scale(0.4); }
  }

  @keyframes branchLife{
    0%,5.6% { opacity:0; transform: scale(0.35); }
    9%      { opacity:1; transform: scale(1.16); }
    12%     { opacity:1; transform: scale(1); }
    76%     { opacity:1; transform: scale(1); }
    80%     { opacity:0; transform: scale(0.45); }
    100%    { opacity:0; transform: scale(0.35); }
  }

  @keyframes satLife{
    0%,11.25% { opacity:0; transform: scale(0.3); }
    15%       { opacity:1; transform: scale(1.2); }
    18%       { opacity:1; transform: scale(1); }
    64%       { opacity:1; transform: scale(1); }
    68%       { opacity:0; transform: scale(0.4); }
    100%      { opacity:0; transform: scale(0.3); }
  }

  /* idle organic float — runs continuously & independently of visibility */
  .node-float{ animation-name: floatBob; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .node-float.node-pulse{ animation-name: floatBob, corePulse; animation-duration: inherit, 2.6s; animation-timing-function: ease-in-out, ease-in-out; animation-iteration-count: infinite, infinite; }

  @keyframes floatBob{
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
  }

  @keyframes corePulse{
    0%,100% { filter: drop-shadow(0 0 14px rgba(193,96,45,0.45)); }
    50%     { filter: drop-shadow(0 0 26px rgba(193,96,45,0.75)); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }

</style>
</head>
<body>

<div class="stage">
  <svg class="graph" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
<radialGradient id="gradCore" cx="35%" cy="30%" r="75%">
  <stop offset="0%" stop-color="#E8895A"/>
  <stop offset="55%" stop-color="var(--terracotta)"/>
  <stop offset="100%" stop-color="var(--terracotta-deep)"/>
</radialGradient>
<radialGradient id="gradBranchL" cx="35%" cy="30%" r="75%">
  <stop offset="0%" stop-color="#FBF6E8"/>
  <stop offset="60%" stop-color="#F1E7CF"/>
  <stop offset="100%" stop-color="#E4D3AC"/>
</radialGradient>
<radialGradient id="gradBranchR" cx="35%" cy="30%" r="75%">
  <stop offset="0%" stop-color="#FBF6E8"/>
  <stop offset="60%" stop-color="#F1E7CF"/>
  <stop offset="100%" stop-color="#E4D3AC"/>
</radialGradient>
<radialGradient id="gradSatL" cx="35%" cy="30%" r="75%">

  <stop offset="65%" stop-color="#F3E9D2"/>
  <stop offset="100%" stop-color="#E7D6B3"/>
</radialGradient>
<radialGradient id="gradSatR" cx="35%" cy="30%" r="75%">
  <stop offset="0%" stop-color="#FDFAF0"/>
  <stop offset="65%" stop-color="#F3E9D2"/>
  <stop offset="100%" stop-color="#E7D6B3"/>
</radialGradient>
<linearGradient id="gradEdgeL" x1="100%" y1="0%" x2="0%" y2="0%">
  <stop offset="0%" stop-color="var(--sage-deep)"/>
  <stop offset="100%" stop-color="var(--ochre)"/>
</linearGradient>
<linearGradient id="gradEdgeR" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="var(--terracotta-deep)"/>
  <stop offset="100%" stop-color="var(--ochre)"/>
</linearGradient>
<symbol id="icon-network" viewBox="0 0 40 40">

  <line x1="20" y1="20" x2="32" y2="25"/><line x1="20" y1="20" x2="20" y2="32"/>

</symbol>
<symbol id="icon-virus" viewBox="0 0 40 40">

  <line x1="27.3" y1="12.7" x2="30.2" y2="9.8"/><line x1="12.7" y1="27.3" x2="9.8" y2="30.2"/>

<symbol id="icon-scale" viewBox="0 0 40 40">

  <line x1="15" y1="26" x2="17" y2="13"/><line x1="25" y1="26" x2="23" y2="13"/><line x1="16" y1="28" x2="24" y2="28"/>

<symbol id="icon-warning" viewBox="0 0 40 40">
  <path d="M20,6 L35,32 L5,32 Z" fill="none" stroke-linejoin="round"/>
  <line x1="20" y1="16" x2="20" y2="24" stroke-linecap="round"/>

</symbol>

  <path d="M20,5 Q28,16 24,22 Q27,20 27,25 Q27,34 20,34 Q13,34 13,25 Q13,20 16,22 Q14,10 20,5 Z" fill="none"/>
</symbol>
<symbol id="icon-droplet" viewBox="0 0 40 40">
  <path d="M20,5 Q31,20 31,26 Q31,35 20,35 Q9,35 9,26 Q9,20 20,5 Z" fill="none"/>

</symbol>

<symbol id="icon-checkdoc" viewBox="0 0 40 40">
  <path d="M11,5 L23,5 L29,11 L29,35 L11,35 Z" fill="none" stroke-linejoin="round"/>
  <path d="M23,5 L23,11 L29,11" fill="none"/>
  <path d="M14,21 L18,25 L26,15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>
    </defs>
    <g transform="translate(-72, -48) scale(1.12)">
      <g class="yantra-layer">
        <circle class="yantra-dot" cx="600" cy="400" r="4"/>

        <g class="yantra-ring1-wrap">
          <g class="yantra-ring1-reveal">
            <circle class="yantra yantra-circ-tight" cx="600" cy="400" r="150"/>
            <circle class="yantra yantra-circ-dash" cx="600" cy="400" r="196"/>
            <circle class="yantra yantra-circ-dot" cx="600" cy="400" r="248"/>
          </g>
        </g>

        <g transform="translate(600,400)">
          <g class="yantra-lotus-outer" fill="none" stroke="var(--terracotta-deep)" stroke-width="1.3">
            <path transform="rotate(0)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(45)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(90)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(135)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(180)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(225)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(270)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
            <path transform="rotate(315)" d="M 0,-46 C 24,-103 24,-161 0,-160 C -24,-161 -24,-103 0,-46 Z"/>
          </g>
